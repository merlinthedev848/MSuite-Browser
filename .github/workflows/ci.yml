name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node.js Test Suite (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite & syntax checks
        run: npm test
        env:
          NODE_ENV: test
          PASSWORD: test_secure_password_1234
          ALLOW_PRIVATE_NAV: '0'
          ALLOW_EMPTY_ORIGIN: '0'

  scripts-and-hygiene:
    name: Shell Scripts & Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Shell Scripts Syntax
        run: |
          bash -n install.sh
          sh -n entrypoint.sh

      - name: Check line endings and executable flags
        run: |
          chmod +x install.sh entrypoint.sh

  docker-build:
    name: Dockerfile Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v5

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          build-args: |
            ENABLE_WARP=0
          tags: msuite-browser:ci
