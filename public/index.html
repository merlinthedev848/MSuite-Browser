<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Virtual Browser</title>
    <meta name="description" content="A secure, remotely-hosted virtual browser session.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="login-container">
        <div class="login-card">
            <div class="login-header">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--accent-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shield-icon" aria-hidden="true">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
                <h2>Secure Session</h2>
                <p>Enter your password to access the remote browser.</p>
            </div>
            <form id="login-form" autocomplete="on">
                <div class="input-group">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input type="password" id="password-input" placeholder="Password" required autocomplete="current-password" />
                </div>
                <div id="login-error" class="error-msg hidden" role="alert"></div>
                <button type="submit" id="login-btn">
                    <span>Connect</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <!-- Main Browser UI -->
    <div id="app-container" class="app-container hidden" aria-label="Remote browser">
        <!-- Toolbar -->
        <header class="toolbar">
            <div class="window-controls" aria-hidden="true">
                <span class="dot close"></span>
                <span class="dot minimize"></span>
                <span class="dot maximize"></span>
            </div>
            <div class="nav-buttons">
                <button id="back-btn" class="nav-btn" aria-label="Go Back" title="Back">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <button id="forward-btn" class="nav-btn" aria-label="Go Forward" title="Forward">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
                <button id="reload-btn" class="nav-btn" aria-label="Reload Page" title="Reload">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 4v6h-6"></path>
                        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                    </svg>
                </button>
            </div>
            <div class="address-bar">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lock-icon" aria-hidden="true">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <input type="text" id="url-input" placeholder="Enter URL or search..." autocomplete="off" spellcheck="false" />
                <button id="go-btn" aria-label="Navigate">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </div>
            <div class="status-indicator" id="status-indicator" aria-live="polite">
                <span class="status-dot disconnected" aria-hidden="true"></span>
                <span class="status-text">Disconnected</span>
            </div>
            <button id="clip-btn" class="clip-btn" title="Clipboard Sync" aria-label="View synced clipboard">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                    <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                </svg>
            </button>
        </header>

        <!-- Tab Bar -->
        <div class="tab-bar" role="tablist" aria-label="Browser tabs">
            <div class="tabs-container" id="tabs-container">
                <!-- Tabs injected dynamically -->
            </div>
            <button id="new-tab-btn" class="new-tab-btn" title="New Tab" aria-label="Open new tab">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
        </div>

        <!-- Browser Display -->
        <main class="browser-viewport">
            <div class="loading-overlay" id="loading-overlay" role="status">
                <div class="spinner" aria-hidden="true"></div>
                <p id="loading-text">Initializing Stream...</p>
            </div>
            <div id="viewport-container" tabindex="0" aria-label="Remote browser display">
                <img id="screencast-a" class="screencast-viewport" alt="Viewport A" />
                <img id="screencast-b" class="screencast-viewport" alt="Viewport B" />
                <div id="interaction-overlay"></div>
            </div>
        </main>

        <!-- Synced Clipboard Modal -->
        <div id="clip-modal" class="clip-modal hidden" role="dialog" aria-labelledby="clip-modal-title">
            <div class="clip-modal-header">
                <h3 id="clip-modal-title">Clipboard Manager</h3>
                <button id="clip-close-btn" aria-label="Close clipboard panel">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <p>Paste text below to push it to the remote browser's keyboard, or copy text retrieved from the remote session:</p>
            <textarea id="clip-text" placeholder="Type or paste content here..." autocomplete="off" spellcheck="false"></textarea>
            <div class="clip-modal-actions">
                <button id="clip-push-btn">Send text to remote cursor</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
